version: 1
repo_role: product

defaults:
  cli: dry-run          # troque para codex quando tiver OPENAI_API_KEY
  models:
    backend-swe: dry-run
    qa: dry-run

roles_enabled: [backend-swe, qa]

stack:
  runtime: node@22
  language: typescript
  framework: fastify

constraints:
  forbid_paths:
    - .github/workflows/**
    - .agentic/**
    - src/schema/**         # contrato so muda via expand/contract
  require_contract_bump: true
  forbid_dependencies_add: true

gates:
  - build
  - test:unit
  - test:contract

pr:
  base_branch: main
  draft: true
  labels: [agentic]
