version: 1
repo_role: product

defaults:
  cli: claude-code
  execution_target: local
  models:
    backend-engineer: claude-sonnet-4-6
    qa: claude-sonnet-4-6

roles_enabled: [backend-engineer, qa]

stack:
  runtime: jvm
  language: kotlin
  framework: ktor
  build_tool: gradle
  test: [ktor-test-host]

constraints:
  forbid_paths:
    - .github/workflows/**
    - .agentic/config.yml         # agent cannot modify its own configuration
    - .agentic/skills/**          # nor repo-specific skills
    - src/main/kotlin/schema/**   # contract changes only via expand/contract
    # .agentic/memory/** is intentionally writable by agents
  require_contract_bump: true
  forbid_dependencies_add: true

memory:
  enabled: true
  consolidate_after_execution: true
  max_episodes: 20

gates:
  - build
  - test

pr:
  base_branch: main
  draft: true
  labels: [agentic]

secrets:
  source: vault
