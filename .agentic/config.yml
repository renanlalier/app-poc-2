version: 1
repo_role: product

defaults:
  cli: dry-run          # troque para codex quando tiver OPENAI_API_KEY
  models:
    backend-engineer: dry-run
    qa: dry-run

roles_enabled: [backend-engineer, qa]

stack:
  runtime: jvm
  language: kotlin
  framework: ktor
  build_tool: gradle
  test: [ktor-test-host]

constraints:
  forbid_paths:
    - .github/workflows/**
    - .agentic/**
    - src/main/kotlin/schema/**   # contrato so muda via expand/contract
  require_contract_bump: true
  forbid_dependencies_add: true

gates:
  - build
  - test

pr:
  base_branch: main
  draft: true
  labels: [agentic]
