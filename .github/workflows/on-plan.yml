name: on-plan

# Phase 1 — Planning.
#
# plan-first-turn — triggered by agent-dispatch via repository_dispatch(agent-plan)
#                   when a new sub-issue is created for this repo, and again by
#                   agent-plan-review when the tech-lead requests revision.
#
# Human comments no longer trigger planning. Iteration is driven by the
# tech-lead's review: if revision is needed, agent-plan-review re-dispatches
# repository_dispatch(agent-plan) so the engineer revises with feedback visible
# in the conversation. The human reviews only the final PR.

on:
  repository_dispatch:
    types: [agent-plan]

jobs:
  plan-first-turn:
    if: github.event_name == 'repository_dispatch' && github.event.action == 'agent-plan'
    uses: renanlalier/agentic-pipeline/.github/workflows/agent-plan.yml@v1
    secrets: inherit
    with:
      role: backend-engineer
      sub_issue: ${{ github.event.client_payload.sub_issue }}
      execution_id: ${{ github.event.client_payload.execution_id }}
      contract_ref: ${{ github.event.client_payload.contract_ref || 'v1' }}
      cli_override: ${{ github.event.client_payload.cli_override || '' }}
      model_override: ${{ github.event.client_payload.model_override || '' }}
      execution_target: ${{ vars.CODEX_EXECUTION_TARGET || '' }}
      requester: ${{ github.event.client_payload.requester || '' }}
